<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Asciugature Inverno</title>
    <!-- Tailwind CSS per una grafica pulita e responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Intestazione -->
        <header class="text-center">
            <h1 class="text-2xl font-bold text-sky-400">Tracker Asciugatrice</h1>
            <p class="text-sm text-slate-400">Gestione costi e consumi invernali</p>
        </header>

        <!-- Pannello Totali Monetari Breve Termine -->
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                <span class="block text-xs text-slate-400">Oggi</span>
                <span id="stat-daily" class="text-lg font-bold text-emerald-400">€ 0.00</span>
            </div>
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                <span class="block text-xs text-slate-400">Questa Settimana</span>
                <span id="stat-weekly" class="text-lg font-bold text-sky-400">€ 0.00</span>
            </div>
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                <span class="block text-xs text-slate-400">Questo Mese</span>
                <span id="stat-monthly" class="text-lg font-bold text-purple-400">€ 0.00</span>
            </div>
        </div>

        <!-- Pannello Stagionale e Totale (Cicli + Costi) -->
        <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-1">
                <span class="block text-xs text-slate-400">Stagione (Dal 1° Set)</span>
                <div id="stat-count-season" class="text-lg font-bold text-amber-400">0 cicli</div>
                <div id="stat-cost-season" class="text-sm font-semibold text-emerald-400">€ 0.00</div>
            </div>
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-1">
                <span class="block text-xs text-slate-400">Totale Storico</span>
                <div id="stat-count-total" class="text-lg font-bold text-sky-300">0 cicli</div>
                <div id="stat-cost-total" class="text-sm font-semibold text-emerald-400">€ 0.00</div>
                <span id="stat-start-date" class="block text-[10px] text-slate-500 mt-0.5">Dal: -</span>
            </div>
        </div>

        <!-- Form Inserimento -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Nuova Asciugatura</h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Data</label>
                <input type="date" id="input-date" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Durata (Minuti)</label>
                    <select id="input-minutes" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                        <option value="15">15 minuti</option>
                        <option value="30" selected>30 minuti</option>
                        <option value="45">45 minuti</option>
                        <option value="60">60 minuti</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Costo ogni 15 min (€)</label>
                    <input type="number" id="input-rate" value="2.80" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
            </div>

            <button onclick="addSession()" class="w-full bg-sky-600 hover:bg-sky-500 font-semibold py-2 rounded transition">Registra Asciugatura</button>
        </div>

        <!-- Storico Giorni e Pulsante Export -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-200">Storico Sessioni</h2>
                <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-3 py-1.5 rounded transition">Export txt</button>
            </div>
            <div id="sessions-list" class="space-y-2 max-h-60 overflow-y-auto text-sm">
                <p class="text-slate-500 text-center">Caricamento...</p>
            </div>
        </div>

    </div>

    <script>
        // Configurazione Supabase precompilata
        const SUPABASE_URL = 'https://avxfltymuhnumvqznxfw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZamRqj1d6kyuoOiBbEbagg_zFkeOee2';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variabile globale per memorizzare le sessioni scaricate
        let cachedSessions = [];

        // Imposta la data odierna di default nel form
        document.getElementById('input-date').valueAsDate = new Date();

        // Funzione per formattare la data da AAAA-MM-GG a GG/MM/AAAA
        function formatDateIT(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        async function fetchSessions() {
            const { data, error } = await _supabase
                .from('drying_sessions')
                .select('*')
                .order('date', { ascending: false });

            if (error) {
                console.error('Errore nel recupero dati:', error);
                return;
            }

            cachedSessions = data || [];
            renderData(cachedSessions);
        }

        async function addSession() {
            const date = document.getElementById('input-date').value;
            const minutes = parseInt(document.getElementById('input-minutes').value);
            const rate = parseFloat(document.getElementById('input-rate').value);

            if (!date || isNaN(minutes) || isNaN(rate)) {
                alert('Compila tutti i campi correttamente.');
                return;
            }

            // Calcolo costo: (minuti / 15) * costo per 15 min
            const totalCost = (minutes / 15) * rate;

            const { error } = await _supabase.from('drying_sessions').insert([
                { date, duration_minutes: minutes, cost_per_15min: rate, total_cost: totalCost }
            ]);

            if (error) {
                alert('Errore durante il salvataggio: ' + error.message);
            } else {
                fetchSessions();
            }
        }

        async function deleteSession(id) {
            if (!confirm('Vuoi eliminare questa voce?')) return;
            const { error } = await _supabase.from('drying_sessions').delete().eq('id', id);
            if (!error) fetchSessions();
        }

        function renderData(sessions) {
            const listEl = document.getElementById('sessions-list');
            listEl.innerHTML = '';

            let dailyTotal = 0;
            let weeklyTotal = 0;
            let monthlyTotal = 0;
            
            let seasonCount = 0;
            let seasonCost = 0;
            
            let totalCount = sessions.length;
            let totalCostAll = 0;
            let oldestDate = null;

            const todayStr = new Date().toISOString().split('T')[0];
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; // 1-12

            // Definizione intervallo stagione (1 Settembre anno X -> 31 Agosto anno X+1)
            let seasonStartYear = currentMonth >= 9 ? currentYear : currentYear - 1;
            let seasonStartDate = new Date(`${seasonStartYear}-09-01`);
            let seasonEndDate = new Date(`${seasonStartYear + 1}-08-31`);

            if (sessions.length === 0) {
                listEl.innerHTML = '<p class="text-slate-500 text-center">Nessuna asciugatura registrata.</p>';
                updateStats(0, 0, 0, 0, 0, 0, 0, '-');
                return;
            }

            // Trova la data più vecchia ordinando in modo crescente per data
            const sortedAsc = [...sessions].sort((a, b) => new Date(a.date) - new Date(b.date));
            oldestDate = sortedAsc[0].date;

            sessions.forEach(s => {
                const sDate = new Date(s.date);
                const sCost = parseFloat(s.total_cost);

                // Somma totale complessiva
                totalCostAll += sCost;
                
                // Totali monetari brevi
                if (s.date === todayStr) dailyTotal += sCost;
                
                const diffTime = Math.abs(now - sDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays <= 7) weeklyTotal += sCost;
                
                if (sDate.getMonth() === now.getMonth() && sDate.getFullYear() === now.getFullYear()) {
                    monthlyTotal += sCost;
                }

                // Conteggio e costo stagione in corso
                if (sDate >= seasonStartDate && sDate <= seasonEndDate) {
                    seasonCount++;
                    seasonCost += sCost;
                }

                const formattedDate = formatDateIT(s.date);

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700/50';
                item.innerHTML = `
                    <div>
                        <span class="font-medium text-slate-300">${formattedDate}</span>
                        <span class="text-xs text-slate-400 block">${s.duration_minutes} min (${s.cost_per_15min}€ / 15m)</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-emerald-400">€ ${sCost.toFixed(2)}</span>
                        <button onclick="deleteSession('${s.id}')" class="text-red-400 hover:text-red-300 text-xs">✕</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            updateStats(dailyTotal, weeklyTotal, monthlyTotal, seasonCount, seasonCost, totalCount, totalCostAll, formatDateIT(oldestDate));
        }

        function updateStats(daily, weekly, monthly, seasonCount, seasonCost, totalCount, totalCostAll, startDateFormatted) {
            document.getElementById('stat-daily').innerText = `€ ${daily.toFixed(2)}`;
            document.getElementById('stat-weekly').innerText = `€ ${weekly.toFixed(2)}`;
            document.getElementById('stat-monthly').innerText = `€ ${monthly.toFixed(2)}`;
            
            document.getElementById('stat-count-season').innerText = `${seasonCount} cicli`;
            document.getElementById('stat-cost-season').innerText = `€ ${seasonCost.toFixed(2)}`;
            
            document.getElementById('stat-count-total').innerText = `${totalCount} cicli`;
            document.getElementById('stat-cost-total').innerText = `€ ${totalCostAll.toFixed(2)}`;
            document.getElementById('stat-start-date').innerText = `Dal: ${startDateFormatted}`;
        }

        function exportData() {
            if (cachedSessions.length === 0) {
                alert('Nessuna sessione da esportare.');
                return;
            }

            // Raggruppa i totali per mese (es. "2026-10")
            const monthlySums = {};
            cachedSessions.forEach(s => {
                const monthKey = s.date.substring(0, 7); // Anno-Mese
                if (!monthlySums[monthKey]) {
                    monthlySums[monthKey] = 0;
                }
                monthlySums[monthKey] += parseFloat(s.total_cost);
            });

            // Costruisce il testo del file
            let content = "=== REPORT ASCIUGATURE INVERNO ===\n\n";
            content += "--- SOMME MENSILI ---\n";
            for (const [month, total] of Object.entries(monthlySums)) {
                content += `Mese: ${month} -> Totale: € ${total.toFixed(2)}\n`;
            }

            content += "\n--- DETTAGLIO SESSIONI ---\n";
            cachedSessions.forEach(s => {
                const formattedDate = formatDateIT(s.date);
                content += `Data: ${formattedDate} | Durata: ${s.duration_minutes} min | Tariffa: ${s.cost_per_15min}€/15m | Totale: € ${parseFloat(s.total_cost).toFixed(2)}\n`;
            });

            // Crea il file di testo e avvia il download automatico
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'report_asciugature.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        fetchSessions();
    </script>
</body>
</html>
